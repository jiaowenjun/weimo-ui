name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - weimo-ui-core
          - weimo-ui-template
          - weimo-ui-editor
          - weimo-ui-stats
          - weimo-ui-tagtree
          - weimo-ui-image
          - weimo-ui-ocr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build package, site and workspace deps
        run: pnpm --filter ${{ matrix.package }}-site... build
      - name: Verify package
        run: pnpm --dir packages/${{ matrix.package }} verify
